<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b6b8a" />
    <title>Sa Blava — Kayak QR Experience</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
  </head>
  <body>
    <div class="app-frame" id="app">
      <main class="screen-stack" id="screen-stack" aria-live="polite"></main>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@rive-app/canvas@2.30.0"></script>
    <script type="module" src="./js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Self-heal: when a freshly deployed SW takes control, reload once
        // so the open page picks up the new design instead of the old one.
        var swRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (swRefreshing) return;
          swRefreshing = true;
          window.location.reload();
        });
        navigator.serviceWorker.register('./sw.js').catch(function(e) {
          console.warn('[Sa Blava] Service Worker registration failed:', e);
        });
      }
    </script>
  </body>
</html>
